# Static server for the web-editor examples site.
#
# The site is 100% static (HTML + hashed JS/CSS assets emitted by the Vite
# multi-page build) with no backend, so the vulnerability scanners that
# constantly probe a public host (leakix/l9scan et al. hitting /api/gql,
# info.php, /telescope, .git, .env, ...) have nothing to exploit — they only
# spam the logs. Drop that traffic silently with 444 (close the connection, no
# response, no log line).

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # 1. Known vulnerability scanners by User-Agent → close immediately.
    if ($http_user_agent ~* "(l9scan|leakix|nikto|sqlmap|nmap|masscan|zgrab|censys|nuclei|httpx|semrush|petalbot)") {
        return 444;
    }

    # 2. Exploit-probe file extensions this static site never serves.
    location ~* \.(php|phtml|asp|aspx|jsp|cgi|pl|env|ini|sh|bak|old|sql)$ {
        access_log off;
        return 444;
    }

    # 3. Exploit-probe paths (app frameworks, VCS/CI metadata, dotfiles).
    location ~* /(\.git|\.svn|\.hg|\.env|wp-admin|wp-login|wp-content|wp-includes|xmlrpc|telescope|actuator|vendor|META-INF|WEB-INF|phpmyadmin|pma|adminer|owa)(/|$) {
        access_log off;
        return 444;
    }

    # 4. Hashed build assets are immutable (the filename changes when the content
    #    does), so cache them hard — a redeploy ships new filenames the HTML
    #    points at, never a stale asset.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 5. Everything legitimate (the HTML pages): serve the file or a normal 404.
    #    The HTML filenames are stable (index.html, examples-*.html), so send
    #    `no-cache` (always revalidate via ETag: a cheap 304 when unchanged, the
    #    fresh bytes the moment a new image is deployed) — visitors never get a
    #    stale page pointing at an old asset bundle.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
