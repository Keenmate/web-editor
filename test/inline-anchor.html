<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>km-editor — inline-anchor</title>
</head>
<body>
    <!-- Targeted by e2e/inline-anchor.spec.ts. -->
    <div id="scroller" style="height:300px;overflow:auto;border:1px solid #ccc"><div style="height:120px"></div><p id="target">Anchor target</p><div style="height:1200px"></div></div>
    <km-editor id="subject" view-mode="inline" anchor="#target" value="# Title

plain words here"></km-editor>
    <pre data-testid="inline-anchor-log"></pre>

    <script type="module">
        import '/src/index.ts';
        const log = document.querySelector('[data-testid="inline-anchor-log"]');
        const el = document.getElementById('subject');
        for (const type of ['change', 'view-mode-change', 'action']) {
            el.addEventListener(type, (e) => {
                const d = type === 'change' ? e.detail.contentFormat : type === 'view-mode-change' ? e.detail.viewMode : e.detail.action;
                log.textContent += `${type}:${d}\n`;
            });
        }

        window.fixtureReady = true;
    </script>
</body>
</html>
