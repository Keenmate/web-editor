<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>km-editor — formatting</title>
</head>
<body>
    <!-- Targeted by e2e/formatting.spec.ts. -->
    <km-editor id="subject" value="# Title

plain words here"></km-editor>
    <pre data-testid="formatting-log"></pre>

    <script type="module">
        import '/src/index.ts';
        const log = document.querySelector('[data-testid="formatting-log"]');
        const el = document.getElementById('subject');
        for (const type of ['change', 'view-mode-change', 'action']) {
            el.addEventListener(type, (e) => {
                const d = type === 'change' ? e.detail.format : type === 'view-mode-change' ? e.detail.viewMode : e.detail.action;
                log.textContent += `${type}:${d}\n`;
            });
        }

        window.fixtureReady = true;
    </script>
</body>
</html>
